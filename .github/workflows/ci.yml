name: CI

# 站点是「数据 + 模板 + 构建」三层：
#   content/site.json  数据
#   tools/template.html 结构
#   index.html         构建产物（由 tools/build.py 生成，提交进仓库）
# 推 main 时自动重建产物并提交；提 PR 时要求产物与数据保持同步。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data-check:
    name: 数据检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 结构 / 明细 / 联动 / 资源 / 占位符
        run: python tools/check_site.py --no-build --skip-seo --verbose

  rebuild:
    name: 重建产物并提交
    needs: data-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 重建 index.html
        run: python tools/build.py

      - name: 重新生成 sitemap 与 robots
        run: python tools/gen_seo.py

      - name: 提交重建后的产物
        run: |
          git add index.html sitemap.xml robots.txt
          if [ -f robots.host.txt ]; then git add robots.host.txt; fi
          if git diff --cached --quiet; then
            echo "产物已是最新，无需提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 由 content/site.json 重建 index.html"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  verify:
    name: 产物同步检查
    needs: data-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: index.html 必须与数据 + 模板一致
        run: |
          python tools/build.py --check
          python tools/check_site.py --verbose
